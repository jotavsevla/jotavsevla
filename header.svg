<svg width="900" height="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      0%, 50% { opacity: 1 }
      51%, 100% { opacity: 0 }
    }
    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6 }
      50% { opacity: 1 }
    }
    .bg { fill: #0d1117; }
    .panel-border { stroke: #30363d; stroke-width: 1; fill: none; }
    .panel-header { fill: #161b22; }
    .title { fill: #58a6ff; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .title-active { fill: #0d1117; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .title-bg { fill: #58a6ff; }
    .item { fill: #8b949e; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
    .item-purple { fill: #a371f7; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
    .item-selected { fill: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; }
    .item-num { fill: #6e7681; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    .highlight-bar { fill: #238636; }
    .content { fill: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .content-title { fill: #58a6ff; font-family: 'Consolas', 'Monaco', monospace; font-size: 18px; font-weight: bold; }
    .content-dim { fill: #8b949e; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .content-green { fill: #7ee787; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .content-yellow { fill: #d29922; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .content-purple { fill: #a371f7; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; }
    .content-link { fill: #58a6ff; font-family: 'Consolas', 'Monaco', monospace; font-size: 15px; text-decoration: underline; }
    .tag { fill: #0d1117; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; font-weight: bold; }
    .tag-bg-green { fill: #238636; }
    .tag-bg-yellow { fill: #d29922; }
    .tag-bg-purple { fill: #a371f7; }
    .tag-bg-blue { fill: #1f6feb; }
    .tag-bg-gray { fill: #6e7681; }
    .statusbar { fill: #161b22; }
    .statusbar-text { fill: #8b949e; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; }
    .statusbar-green { fill: #238636; }
    .big-title { fill: #7ee787; font-family: 'Consolas', 'Monaco', monospace; font-size: 38px; font-weight: bold; }
    .big-subtitle { fill: #8b949e; font-family: 'Consolas', 'Monaco', monospace; font-size: 18px; }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
    .learning { animation: pulse 2s infinite; }
    .fade1 { animation: fadeIn 0.3s ease-out 0.1s both; }
    .fade2 { animation: fadeIn 0.3s ease-out 0.2s both; }
    .fade3 { animation: fadeIn 0.3s ease-out 0.3s both; }
    .fade4 { animation: fadeIn 0.3s ease-out 0.4s both; }
    .bar-bg { fill: #30363d; }
    .bar-green { fill: #7ee787; }
    .bar-yellow { fill: #d29922; }
    .pct { fill: #6e7681; font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    a { cursor: pointer; }
    a:hover .item { fill: #c9d1d9; transition: fill 0.2s; }
    a:hover .item-selected { fill: #ffffff; transition: fill 0.2s; }
    a:hover .content-link { fill: #79c0ff; transition: fill 0.2s; }
